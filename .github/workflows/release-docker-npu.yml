name: Release Docker Images (NPU)

on:
  push:
    tags: ['v[0-9]+.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after registry credentials and permissions are configured
        type: boolean
        default: false
  workflow_call:
    inputs:
      image_tag:
        description: Additional tag prefix (the hardware suffix is appended)
        type: string
        default: ''
      publish:
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: release-npu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.config.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read shared NPU configuration
        id: config
        run: |
          matrix=$(python scripts/npu/config.py --matrix)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.config.outputs.matrix) }}
    steps:
      # Reuse the standard Docker Hub secrets used by SGLang's lmsysorg releases.
      - name: Validate publication settings
        if: github.event_name != 'pull_request' && (inputs.publish || github.event_name == 'push')
        env:
          REPOSITORY: ${{ github.repository }}
          PUBLISH_ENABLED: ${{ vars.NPU_DOCKER_PUBLISH_ENABLED }}
          HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          [[ "$REPOSITORY" == sgl-project/sglang-omni ]] || { echo 'Publication is restricted to the upstream repository.' >&2; exit 1; }
          [[ "$PUBLISH_ENABLED" == true ]] || { echo 'Set NPU_DOCKER_PUBLISH_ENABLED=true to publish.' >&2; exit 1; }
          [[ -n "$HUB_USERNAME" && -n "$HUB_TOKEN" ]] || { echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets.' >&2; exit 1; }
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lmsysorg/sglang-omni
          flavor: latest=false
          tags: |
            type=ref,event=tag,suffix=-cann${{ matrix.cann }}-${{ matrix.device }}
            type=sha,suffix=-cann${{ matrix.cann }}-${{ matrix.device }}
            type=raw,value=${{ inputs.image_tag }}-cann${{ matrix.cann }}-${{ matrix.device }},enable=${{ inputs.image_tag != '' }}
      - name: Log into Docker Hub
        if: github.repository == 'sgl-project/sglang-omni' && vars.NPU_DOCKER_PUBLISH_ENABLED == 'true' && github.event_name != 'pull_request' && (inputs.publish || github.event_name == 'push')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/npu.Dockerfile
          platforms: linux/arm64
          build-args: |
            SGLANG_IMAGE=${{ matrix.base_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: ${{ github.repository == 'sgl-project/sglang-omni' && vars.NPU_DOCKER_PUBLISH_ENABLED == 'true' && github.event_name != 'pull_request' && (inputs.publish || github.event_name == 'push') }}
          provenance: false
          cache-from: type=gha,scope=npu-${{ matrix.device }}
          cache-to: type=gha,mode=max,scope=npu-${{ matrix.device }}
      - name: Record image digest
        env:
          IMAGE: lmsysorg/sglang-omni
          DIGEST: ${{ steps.build.outputs.digest }}
          DEVICE: ${{ matrix.device }}
          PUBLISHED: ${{ github.repository == 'sgl-project/sglang-omni' && vars.NPU_DOCKER_PUBLISH_ENABLED == 'true' && github.event_name != 'pull_request' && (inputs.publish || github.event_name == 'push') }}
        run: |
          {
            echo "### NPU image: $DEVICE"
            echo "Published: $PUBLISHED"
            echo "Image: $IMAGE@$DIGEST"
            echo 'Only published digests can be pulled for model CI.'
          } >> "$GITHUB_STEP_SUMMARY"
